name: trading-bot

on:
  schedule:
    # Every 10 min, 14:00-20:50 UTC, Mon-Fri = 9:00-15:50 New York time (EST, Nov-Mar).
    # From March (EDT) change to "*/10 13-19 * * 1-5". GitHub may delay scheduled runs at busy times.
    - cron: "*/10 14-20 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "run | report | status"
        default: report

concurrency:
  group: trading-bot          # never two runs at once (prevents double buys)
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        run: python bot.py ${{ github.event.inputs.mode || 'run' }}
        env:
          ALPACA_API_KEY: ${{ PKVKKXO5DPEZ3YKXQ6ITLMDCIP }}
          ALPACA_SECRET_KEY: ${{ 3kiS8TTUEXDQdoqfwqJYE1CDLG2DEPFY2ZnPXC1QnyFr }}
