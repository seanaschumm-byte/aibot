name: crypto-dip-bot

on:
  schedule:
    - cron: "37 * * * *"     # every hour at :37, 24/7
  workflow_dispatch:
    inputs:
      mode:
        description: "run | report"
        default: report

concurrency:
  group: crypto-dip-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run dip bot
        run: python dip_bot.py ${{ github.event.inputs.mode || 'run' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
