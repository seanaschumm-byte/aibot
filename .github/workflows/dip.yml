name: "Bot 3 - Crypto daily dip (STOPPED)"

on:
  # schedule removed on 2026-11-14: bot stopped. Re-add a cron line to restart it.
  workflow_dispatch:
    inputs:
      mode:
        description: "run | report"
        default: report

concurrency:
  group: crypto-dip-bot
  cancel-in-progress: false

permissions:
  contents: write   # lets the run save journal/*.jsonl to the repo

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run dip bot
        run: python dip_bot.py ${{ github.event.inputs.mode || 'run' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Save trade journal
        if: always()
        run: |
          git config user.name "aibot-journal"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal/ 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "journal: ${{ github.workflow }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((i*5)); done
          exit 1
