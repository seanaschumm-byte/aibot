name: "Justin"

on:
  schedule:
    - cron: "7,37 14-20 * * 1-5"   # every 30 min in US market hours; trades once per day after 9:45 New York
  workflow_dispatch:

concurrency:
  group: justin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - name: Run
        run: python -m justin.bot
      - name: Save state
        if: always()
        run: |
          git config user.name "justin"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add justin/state/ journal/ 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "Justin state $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((i*5)); done
          exit 1
