name: "Sean Lavarge"

on:
  schedule:
    - cron: "2,17,32,47 14-20 * * 1-5"   # every 15 min in US market hours (it trades 2x crypto ETFs on Alpaca)
  workflow_dispatch:
    inputs:
      mode:
        description: "run | binance | check | backtest"
        default: run

concurrency:
  group: sean-lavarge
  cancel-in-progress: false

permissions:
  contents: write   # saves sean_lavarge/state/state.json between runs

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTNET: "true"            # paper / demo money. Set to "false" only after 30 days of testing.
      PAPER: "true"              # Alpaca paper account
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      EXCHANGE_ID: binanceusdm   # only for mode "binance" (futures testnet version)
      EXCHANGE_API_KEY: ${{ secrets.SEAN_EXCHANGE_API_KEY }}
      EXCHANGE_SECRET: ${{ secrets.SEAN_EXCHANGE_SECRET }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r sean_lavarge/requirements.txt alpaca-py
      - name: Run
        run: |
          MODE="${{ github.event.inputs.mode || 'run' }}"
          case "$MODE" in
            run)      python -m sean_lavarge.alpaca_main ;;
            binance)  python -m sean_lavarge.main ;;
            check)    python -m sean_lavarge.check ;;
            backtest) python -m sean_lavarge.backtest ;;
          esac
      - name: Save state
        if: always()
        run: |
          git config user.name "sean-lavarge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sean_lavarge/state/ sean_lavarge/backtest_report.md 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "Sean Lavarge state $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((i*5)); done
          exit 1
