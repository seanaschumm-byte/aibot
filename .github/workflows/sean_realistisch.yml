name: "Sean Realistisch"

on:
  schedule:
    - cron: "*/30 14-20 * * 1-5"   # every 30 min, 9:00-15:30 New York (EST); the bot trades 9:45-15:50 only
  workflow_dispatch:
    inputs:
      mode:
        description: "run | backtest"
        default: run

concurrency:
  group: sean-realistisch
  cancel-in-progress: false

permissions:
  contents: write   # saves sean_realistisch/state/state.json between runs

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAPER: "true"              # Alpaca paper trading. Set "false" only after 30 days of testing.
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r sean_realistisch/requirements.txt
      - name: Run
        run: |
          if [ "${{ github.event.inputs.mode }}" = "backtest" ]; then python -m sean_realistisch.backtest; else python -m sean_realistisch.main; fi
      - name: Save state
        if: always()
        run: |
          git config user.name "sean-realistisch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sean_realistisch/state/ sean_realistisch/backtest_report.md 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "Sean Realistisch state $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((i*5)); done
          exit 1
