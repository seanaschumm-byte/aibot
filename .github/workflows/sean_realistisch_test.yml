name: "Sean Realistisch - backtest"

on:
  push:
    paths: ["sean_realistisch/**.py", ".github/workflows/sean_realistisch_test.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r sean_realistisch/requirements.txt
      - name: Unit tests
        run: python -m pytest -q test_sean_realistisch.py
      - name: Backtest 24 months ($500 + $300/month), stocks + gold + 2 bond ETFs
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m sean_realistisch.backtest
      - name: Comparison, TLT as the only bond ETF
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SLEEVES: "SPY,QQQ,GLD,TLT"
        run: python -m sean_realistisch.backtest
      - name: Comparison, old 3-market version
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SLEEVES: "SPY,QQQ,GLD"
        run: python -m sean_realistisch.backtest
